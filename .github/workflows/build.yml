name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: athrill-target-rh850f1x

      - name: Select Athrill branch
        id: athrill_ref
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if git ls-remote --exit-code --heads https://github.com/toppers/athrill.git "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=cpp" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Athrill
        uses: actions/checkout@v4
        with:
          repository: toppers/athrill
          ref: ${{ steps.athrill_ref.outputs.ref }}
          path: athrill

      - name: Build and test
        working-directory: athrill-target-rh850f1x
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
