name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: athrill-target-rh850f1x

      # The Athrill core is pinned to the commit of tag v3.0.0, as in
      # .devcontainer/post-create.sh. (A same-name core branch is not used:
      # this branch is named cpp, and so is the core's development branch.)
      - name: Select Athrill core
        id: athrill_ref
        run: |
          echo "ref=29ff9174d6c48de9dcbcd581a36a6b24904d91b4" >> "$GITHUB_OUTPUT"
          echo "name=v3.0.0" >> "$GITHUB_OUTPUT"

      - name: Checkout Athrill
        uses: actions/checkout@v4
        with:
          repository: toppers/athrill
          ref: ${{ steps.athrill_ref.outputs.ref }}
          path: athrill

      - name: Build and test
        working-directory: athrill-target-rh850f1x
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
