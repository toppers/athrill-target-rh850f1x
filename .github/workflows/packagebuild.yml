name: package build

on:
  push:
    tags: ['v*', 'RC*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: athrill-target-rh850f1x
          fetch-depth: 0

      # The Athrill core is pinned to the commit of tag v3.0.0, as in
      # .devcontainer/post-create.sh. A toppers/athrill branch with the same
      # name as this branch, if any, is used instead for joint changes.
      - name: Select Athrill core
        id: athrill_ref
        env:
          ATHRILL_TAG: v3.0.0
          ATHRILL_COMMIT: 29ff9174d6c48de9dcbcd581a36a6b24904d91b4
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [ "$GITHUB_REF_TYPE" = branch ] && git ls-remote --exit-code --heads https://github.com/toppers/athrill.git "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$ATHRILL_COMMIT" >> "$GITHUB_OUTPUT"
            echo "name=$ATHRILL_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Athrill
        uses: actions/checkout@v4
        with:
          repository: toppers/athrill
          ref: ${{ steps.athrill_ref.outputs.ref }}
          path: athrill

      - name: Build, test, and install
        working-directory: athrill-target-rh850f1x
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix .
          # makerelease cannot read files above the package directory, so the
          # sibling Athrill checkout is linked in and packaged as athrill/.
          ln -s ../athrill athrill
          git clone https://github.com/mitsut/toppers_utils.git
          perl toppers_utils/makerelease E_PACKAGE
          cd RELEASE
          sha256sum *.tar.gz > SHA256SUMS

      - name: Write release notes
        working-directory: athrill-target-rh850f1x
        env:
          ATHRILL_REF: ${{ steps.athrill_ref.outputs.name }}
        run: |
          PREVIOUS_TAG=$(git tag --sort=-creatordate | sed -n 2p)
          {
            echo "Athrill core: toppers/athrill ${ATHRILL_REF} @ $(git -C ../athrill rev-parse HEAD)"
            echo
            git log --oneline --pretty=tformat:"%h %s" "$PREVIOUS_TAG..${GITHUB_REF_NAME}"
          } > RELEASE_NOTES.txt

      - name: Create Release
        working-directory: athrill-target-rh850f1x
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" RELEASE/*.tar.gz RELEASE/SHA256SUMS \
            --title "Release ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.txt --draft --prerelease
